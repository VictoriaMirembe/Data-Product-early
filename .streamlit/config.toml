[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "18px", "16px", "14px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
paddingTop = "1rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#155E75"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#155E75"
borderColor = "#D8E2EC"
chartCategoricalColors = ["#155E75", "#2563EB", "#0F766E", "#7C3AED", "#D97706", "#DC2626", "#0891B2"]
chartSequentialColors = ["#F0F9FF", "#E0F2FE", "#BAE6FD", "#7DD3FC", "#38BDF8", "#0EA5E9", "#0284C7", "#0369A1", "#075985", "#0C4A6E"]
dataframeBorderColor = "#D8E2EC"
dataframeHeaderBackgroundColor = "#E8EEF5"
dataframeHeaderTextColor = "#0F172A"

[theme.dark]
primaryColor = "#0369A1"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
textColor = "#E2E8F0"
linkColor = "#7DD3FC"
borderColor = "#26354A"
chartCategoricalColors = ["#38BDF8", "#60A5FA", "#34D399", "#A78BFA", "#FBBF24", "#F87171", "#22D3EE"]
chartSequentialColors = ["#0C4A6E", "#075985", "#0369A1", "#0284C7", "#0EA5E9", "#38BDF8", "#7DD3FC", "#BAE6FD", "#E0F2FE", "#F0F9FF"]
dataframeBorderColor = "#26354A"
dataframeHeaderBackgroundColor = "#111C2E"
dataframeHeaderTextColor = "#F8FAFC"

[theme.light.sidebar]
backgroundColor = "#102D46"
secondaryBackgroundColor = "#193B58"
codeBackgroundColor = "#193B58"
codeTextColor = "#E0F2FE"
textColor = "#F8FAFC"
linkColor = "#7DD3FC"
borderColor = "#284B67"
primaryColor = "#0F766E"

[theme.dark.sidebar]
backgroundColor = "#071421"
secondaryBackgroundColor = "#10253A"
codeBackgroundColor = "#10253A"
codeTextColor = "#E0F2FE"
textColor = "#F1F5F9"
linkColor = "#67E8F9"
borderColor = "#1E3A52"
primaryColor = "#0F766E"
